name: Build PrintF v2
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  printer-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install agent test dependencies
        run: python -m pip install "supabase>=2.0.0" "httpx>=0.25.0" "Pillow>=10.0.0" "PyMuPDF>=1.23.0"
      - name: Test printer-agent API contract
        run: python -m unittest discover -s printf-agent -p "test_agent.py" -v

  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all Supabase Edge Functions
        run: deno check supabase/functions/*/index.ts
